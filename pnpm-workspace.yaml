packages:
  - 'packages/*'
  - 'extensions/*'
  - 'examples/*'

allowBuilds:
  '@swc/core': true
  electron: true
  esbuild: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@storybook/addon-docs@10.4.3'
  - '@storybook/builder-vite@10.4.3'
  - '@storybook/csf-plugin@10.4.3'
  - '@storybook/react-dom-shim@10.4.3'
  - '@storybook/react-vite@10.4.3'
  - '@storybook/react@10.4.3'
  - storybook@10.4.3

overrides:
  # Clear GHSA-gcfj-64vw-6mp9 under @storybook/test-runner → wait-on.
  axios: '>=1.18.0'
  # Clear DOMPurify advisories under monaco-editor (0.56 still ships 3.4.8).
  dompurify: '>=3.4.12'
  # Keep Storybook test-runner on the same Playwright revision CI installs.
  playwright: 1.61.1
  playwright-core: 1.61.1
