name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
      - 'chore/**'
      - 'codex/**'
      - 'feature/**'

permissions:
  contents: read

concurrency:
  group: workbench-kit-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build workspace packages
        run: node scripts/build-workspace-packages.mjs

      - name: Install Electron binary
        run: pnpm rebuild electron

      - name: Electron quit guard smoke
        # The hosted runner cannot preserve Electron's SUID chrome-sandbox mode.
        run: xvfb-run -a pnpm test:electron-quit-guard:ci

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Validate
        # validate:full = validate + required storybook baseline play runs
        run: pnpm validate:full
