name: Publish Workbench Kit

# Tag push only — do not also listen for `release` published.
# `gh release create` pushes a tag and would otherwise start two full runs
# (same concurrency group, cancel-in-progress false → long queue + Playwright reinstall).
on:
  push:
    tags:
      - 'v*'
      - 'workbench-kit-v*'
  workflow_dispatch:
    inputs:
      npm_tag:
        description: npm dist-tag to publish with
        required: false
        default: prototype
      mode:
        description: dry-run validates the pipeline without pushing to npm
        type: choice
        options:
          - dry-run
          - publish
        default: dry-run
      branch_publish_confirm:
        description: Required for branch publish — enter publish-from-branch
        required: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-workbench-kit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish packages to npm
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NPM_DIST_TAG: ${{ inputs.npm_tag || 'prototype' }}
      # Publish every NPM_PUBLISH_ORDER package missing the exact version, including
      # first releases (Trusted Publisher / OIDC). Local publish remains a fallback.
      NPM_PUBLISH_UPDATES_ONLY: 'false'
      # Keep Chromium downloads out of the job workspace noise.
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync package version from tag
        if: github.ref_type == 'tag'
        run: node scripts/sync-version-from-tag.mjs

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build workspace packages
        run: node scripts/build-workspace-packages.mjs

      - name: Install Electron binary
        run: pnpm rebuild electron

      - name: Electron quit guard smoke
        # The hosted runner cannot preserve Electron's SUID chrome-sandbox mode.
        run: xvfb-run -a pnpm test:electron-quit-guard:ci

      - name: Verify release tag
        run: node scripts/check-release-version.mjs

      - name: Prepare npm for trusted publishing
        run: |
          # npm 11.5.1+ required for OIDC trusted publishing; pin recent CLI
          # (mid-batch ENEEDAUTH has been fixed by upgrading npm in the wild).
          npm install -g npm@11.6.2
          npm --version
          for rc in "${NPM_CONFIG_USERCONFIG:-}" "$HOME/.npmrc" "$GITHUB_WORKSPACE/.npmrc"; do
            if [ -n "$rc" ] && [ -f "$rc" ]; then
              sed -i '/_authToken/d;/always-auth/d' "$rc" || true
            fi
          done
          unset NODE_AUTH_TOKEN NPM_TOKEN || true
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "::warning::NPM_TOKEN secret is set but ignored. Publish uses trusted publishing only."
          fi

      - name: Preflight npm publish auth
        run: node scripts/preflight-npm-publish.mjs

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'package.json') }}

      - name: Install Playwright browser
        timeout-minutes: 10
        run: |
          # Chromium only — Storybook play does not need Firefox/WebKit.
          # `--with-deps` apt installs can hang on busy runners; install browser
          # first, then deps, so a cache hit skips the long download.
          pnpm exec playwright install chromium
          pnpm exec playwright install-deps chromium

      - name: Validate
        # validate includes Storybook play; browsers must match root Playwright.
        # Not related to @workbench-kit/electron-shell (npm package only).
        run: pnpm validate

      - name: Guard branch publish
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'publish' && github.ref_type != 'tag' && inputs.branch_publish_confirm != 'publish-from-branch'
        run: |
          echo "::error::Publishing from a branch requires branch_publish_confirm=publish-from-branch"
          exit 1

      - name: Publish (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'dry-run'
        run: |
          unset NODE_AUTH_TOKEN NPM_TOKEN || true
          node scripts/publish-packages.mjs --dry-run

      - name: Publish
        if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'publish')
        run: |
          unset NODE_AUTH_TOKEN NPM_TOKEN || true
          node scripts/publish-packages.mjs
